[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-cate"
version = "0.1.1"
description = "Debiased front-door learners for heterogeneous treatment effects under unmeasured confounding."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Yonghan Jung" }
]
keywords = ["causal-inference", "front-door", "cate", "ate", "heterogeneous-treatment-effect"]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "joblib",
  "xgboost",
]

[project.optional-dependencies]
nn = []
docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
]
viz = [
  "matplotlib",
  "shap",
]
dev = [
  "pytest",
  "ruff",
  "pre-commit",
  "build",
  "twine",
]

[project.scripts]
fdcate = "fd_cate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["FDCATE", "analyze_fars_2000_fd"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fd_cate", "fd_cate.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running integration or simulation tests excluded from PR CI",
]
