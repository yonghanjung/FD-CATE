name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q -m "not slow"

      - name: Build wheel/sdist
        run: python -m build

      - name: Wheel smoke
        run: |
          python -m pip install dist/*.whl
          fdcate --help

      - name: CLI fit smoke
        run: |
          mkdir -p /tmp/fdcate-ci
          fdcate synthetic --n 80 --d 5 --seed 0 --out /tmp/fdcate-ci/synth.csv
          fdcate fit \
            --data /tmp/fdcate-ci/synth.csv \
            --outcome y --treat t --med m \
            --outdir /tmp/fdcate-ci/out \
            --method fd-pi --nuisance-learner xgb
          test -f /tmp/fdcate-ci/out/model.pkl
          test -f /tmp/fdcate-ci/out/results.json
          test -f /tmp/fdcate-ci/out/diagnostics.json
          test -f /tmp/fdcate-ci/out/effects.csv

      - name: CLI demo smoke
        run: |
          fdcate demo --outdir /tmp/fdcate-ci/demo --n 40 --d 4 --seed 0 --run-benchmark false
          test -f /tmp/fdcate-ci/demo/synthetic.csv
          test -f /tmp/fdcate-ci/demo/fit_out/model.pkl
          test -f /tmp/fdcate-ci/demo/fit_out/results.json
          test -f /tmp/fdcate-ci/demo/fit_out/diagnostics.json
          test -f /tmp/fdcate-ci/demo/fit_out/effects.csv
